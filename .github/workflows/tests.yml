name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Tests (numba)
        run: python -m pytest -q tests
      - name: Tests (plain Python, NUMBA_DISABLE_JIT=1)
        env:
          NUMBA_DISABLE_JIT: "1"
        run: python -m pytest -q tests
